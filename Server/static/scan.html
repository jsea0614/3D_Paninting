<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스캔 올리기</title>
<style>
  :root { --ink: #1f2430; --quiet: #5b6475; --accent: #2f6fed; --good: #2e9e5b; --bad: #d93a3a; --line: #d7dce5; --bg: #f3f5f9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 28px; margin: 8px 0 4px; }
  p.lead { color: var(--quiet); margin: 0 0 24px; font-size: 17px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: 18px; margin-bottom: 10px; }
  input[type=text] { width: 100%; min-height: 52px; font: inherit; font-size: 20px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; }
  input[type=file] { font-size: 17px; width: 100%; }
  button.primary { width: 100%; height: 60px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-size: 21px; font-weight: 700; }
  button.primary:disabled { opacity: .4; }
  #status { font-size: 19px; min-height: 28px; margin-top: 14px; }
  #status.good { color: var(--good); } #status.bad { color: var(--bad); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 16px; color: var(--quiet); }
  li:first-child { border-top: 0; }
  li b { color: var(--ink); }
  .thumb { display: inline-block; flex: 0 0 64px; width: 64px; height: 64px; object-fit: contain; background: #edf0f5; border-radius: 10px; }
  .details { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .delete { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--bad); font-size: 16px; }
  #completed { display: none; width: 128px; height: 128px; object-fit: contain; margin-top: 12px; }
  #list-error { color: var(--bad); }
  #worker { color: var(--quiet); font-size: 16px; margin: 16px 0; }
  .tips { line-height: 1.7; color: var(--quiet); font-size: 16px; }
  details { margin: 16px 0; background: white; border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  summary { cursor: pointer; font-size: 18px; font-weight: 600; }
  details label { margin-top: 20px; }
  #choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .candidate { border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: #f8faff; font: inherit; min-height: 48px; }
  .candidate img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
  #actions { display: flex; gap: 12px; margin-top: 16px; }
  #actions[hidden] { display: none; }
  #actions button { flex: 1; min-height: 48px; font: inherit; border: 1px solid var(--line); border-radius: 10px; background: white; }
  @media (max-width: 360px) { #choices { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>스캔 올리기</h1>
  <p class="lead">물건 사진 한 장으로 장식을 만들어요. 보통 3~4분 뒤 마음에 드는 모양을 골라 주세요.</p>
  <p id="worker" role="status">3D 생성 PC: 확인 중…</p>

  <section>
    <label for="name">1. 장식 이름 (최대 12자)</label>
    <input id="name" type="text" maxlength="12" placeholder="예: 초록 공룡">
  </section>

  <section>
    <label for="photo">2. 물건 사진 (JPG, PNG · 20MB 이하)</label>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <p class="tips">정면에서 조금 위(20~30°)에서<br>물건이 화면 절반 이상<br>단색 배경, 바로 위에서 찍지 않기</p>
    <button class="primary" id="send-photo" disabled>사진 보내기</button>
  </section>

  <section>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="choices" aria-label="만들어진 후보"></div>
    <div id="actions" hidden>
      <button id="retry">다시 만들기</button><button id="discard">버리기</button>
    </div>
    <img id="completed" alt="완료된 스캔 장식">
  </section>

  <details>
    <summary>GLB 파일로 올리기</summary>
    <p class="tips">직접 스캔한 파일도 올릴 수 있어요. 위에 장식 이름을 입력해 주세요.</p>
    <label for="file">스캔 파일 (USDZ, GLB, OBJ, FBX)</label>
    <input id="file" type="file" accept=".usdz,.usd,.usdc,.usda,.glb,.gltf,.obj,.fbx">
    <p><button class="primary" id="send" disabled>파일 보내기</button></p>
  </details>

  <section>
    <label>공유 스캔 장식 <span id="count">0 / 40</span></label>
    <p id="list-error" role="status"></p>
    <ul id="list"><li>목록을 불러오는 중…</li></ul>
  </section>
</main>
<script>
  let busy = false, loading = false, activeJob = null, pendingPhoto = null, acting = false;
  const nameInput = document.getElementById("name"), fileInput = document.getElementById("file");
  const send = document.getElementById("send"), status = document.getElementById("status"), list = document.getElementById("list");
  const completed = document.getElementById("completed"), listError = document.getElementById("list-error");
  const photoInput = document.getElementById("photo"), sendPhoto = document.getElementById("send-photo");
  const choices = document.getElementById("choices"), actions = document.getElementById("actions");
  const retry = document.getElementById("retry"), discard = document.getElementById("discard");
  nameInput.oninput = refresh;
  fileInput.onchange = refresh;
  photoInput.onchange = refresh;

  function refresh() {
    const length = Array.from(nameInput.value.trim()).length;
    send.disabled = busy || length < 1 || length > 12 || !fileInput.files.length;
    sendPhoto.disabled = busy || length < 1 || length > 12 || !photoInput.files.length;
    for (const input of [nameInput, fileInput, photoInput]) input.disabled = busy;
    retry.disabled = acting;
    discard.disabled = acting;
  }
  function show(text, kind) { status.textContent = text; status.className = kind || ""; }

  async function request(url, options) {
    const res = await fetch(url, options);
    if (res.status === 204) return null;
    const body = await res.json();
    if (!res.ok) {
      const error = new Error(typeof body.detail === "string" ? body.detail : `서버 오류 (${res.status})`);
      error.status = res.status;
      throw error;
    }
    return body;
  }

  sendPhoto.onclick = async () => {
    if (sendPhoto.disabled) return;
    const file = photoInput.files[0];
    if (!/\.(jpe?g|png)$/i.test(file.name)) { show("사진은 JPG 또는 PNG로 보내 주세요.", "bad"); return; }
    if (file.size > 20 * 1024 * 1024) { show("사진은 20MB 이하로 보내 주세요.", "bad"); return; }
    pendingPhoto = { file, name: nameInput.value.trim() };
    await generatePhoto();
  };

  async function generatePhoto() {
    busy = true;
    acting = false;
    activeJob = null;
    choices.replaceChildren();
    actions.hidden = true;
    completed.style.display = "none";
    refresh();
    show("사진을 보내는 중…");
    const form = new FormData();
    form.append("name", pendingPhoto.name);
    form.append("image", pendingPhoto.file);
    try {
      const body = await request("/api/scans/photo", { method: "POST", body: form });
      activeJob = body.jobId;
      await poll(body.jobId);
    } catch (e) {
      // 접수된 작업을 잃지 않도록 상태 조회 실패 시 같은 작업을 재조회합니다.
      show(e.message, "bad");
      if (!activeJob) busy = false;
    }
    refresh();
  }

  async function chooseCandidate(index) {
    if (acting || !confirm("이 모양을 공유 장식으로 등록할까요?")) return;
    acting = true;
    refresh();
    try {
      const entry = await request(`/api/scans/jobs/${encodeURIComponent(activeJob)}/choose`, {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({index})
      });
      show("등록했어요! 색칠 앱의 스캔 탭에서 쓸 수 있어요.", "good");
      if (entry.thumb) { completed.src = "/" + entry.thumb; completed.style.display = "block"; }
      choices.replaceChildren(); actions.hidden = true;
      busy = false; activeJob = null; pendingPhoto = null; photoInput.value = "";
      await loadList();
    } catch (e) {
      show(e.message, "bad");
      if (e.status === 409 || e.status === 404) await recoverPhoto();
    }
    finally { acting = false; refresh(); }
  }

  async function discardCandidates() {
    if (activeJob) {
      try { await request(`/api/scans/jobs/${encodeURIComponent(activeJob)}/discard`, {method: "POST"}); }
      catch (e) {
        if (e.status !== 409 && e.status !== 404) throw e;
        await recoverPhoto();
        if (activeJob) throw e;
      }
    }
    activeJob = null;
    choices.replaceChildren(); actions.hidden = true;
  }

  async function recoverPhoto() {
    try {
      const job = await request(`/api/scans/jobs/${encodeURIComponent(activeJob)}`);
      if (job.status === "choose") return;
      if (job.status === "done") {
        show("이 작업은 이미 등록했어요.", "good"); pendingPhoto = null;
        await loadList();
      } else show(job.error || "후보 보관 시간이 끝났어요. 다시 보내 주세요.", "bad");
    } catch (e) { if (e.status !== 404) return; }
    activeJob = null; busy = false; choices.replaceChildren(); actions.hidden = true;
  }

  retry.onclick = async () => {
    if (acting || !pendingPhoto) return;
    acting = true; refresh();
    try { await discardCandidates(); if (pendingPhoto) await generatePhoto(); }
    catch (e) { show(e.message, "bad"); }
    finally { acting = false; refresh(); }
  };
  discard.onclick = async () => {
    if (acting) return;
    acting = true; refresh();
    try { await discardCandidates(); busy = false; pendingPhoto = null; show("후보를 버렸어요."); }
    catch (e) { show(e.message, "bad"); }
    finally { acting = false; refresh(); }
  };

  send.onclick = async () => {
    if (send.disabled) return;
    const form = new FormData();
    form.append("name", nameInput.value.trim());
    form.append("file", fileInput.files[0]);
    busy = true;
    refresh();
    completed.style.display = "none";
    show("보내는 중…");
    try {
      const body = await request("/api/scans", { method: "POST", body: form });
      await poll(body.jobId);
    } catch (e) {
      show("보내지 못했어요: " + e.message, "bad");
    }
    busy = false;
    refresh();
  };

  async function poll(jobId) {
    let failures = 0;
    for (;;) {
      let job;
      try { job = await request(`/api/scans/jobs/${encodeURIComponent(jobId)}`); failures = 0; }
      catch (e) {
        if (e.status === 404) {
          show("작업을 찾지 못했어요. 사진을 다시 보내 주세요.", "bad");
          activeJob = null; busy = false; refresh(); return;
        }
        show("상태를 확인하지 못했어요. 다시 연결하는 중… " + e.message, "bad");
        await new Promise(r => setTimeout(r, Math.min(10000, 1000 * ++failures)));
        continue;
      }
      if (job.status === "queued") show("대기 중…");
      else if (job.status === "generating") show(`만드는 중 ${job.progress.done}/${job.progress.total} …`);
      else if (job.status === "converting") show(job.kind === "photo" ? "정리하는 중…" : "변환 중…");
      else if (job.status === "choose") {
        show("마음에 드는 모양을 눌러 주세요.");
        choices.replaceChildren();
        for (const c of job.candidates) {
          if (!c.ok) continue;
          const button = document.createElement("button"), img = document.createElement("img");
          button.className = "candidate";
          img.src = c.thumb; img.alt = `후보 ${c.index + 1}`;
          button.append(img, `후보 ${c.index + 1}`);
          button.onclick = () => chooseCandidate(c.index);
          choices.appendChild(button);
        }
        actions.hidden = false;
        return;
      }
      else if (job.status === "done") {
        show("완료! 모두 색칠 앱의 꾸미기에서 쓸 수 있어요.", "good");
        fileInput.value = "";
        const body = await request("/api/scans");
        const entry = body.scans.find(s => s.itemId === job.itemId);
        if (entry && entry.thumb) {
          completed.src = "/" + entry.thumb;
          completed.onerror = () => { completed.style.display = "none"; };
          completed.style.display = "block";
        }
        await loadList();
        return;
      }
      else {
        show(job.status === "discarded" ? "후보 보관 시간이 지나 버렸어요. 다시 보내 주세요." : job.error || "변환 실패", "bad");
        if (job.kind === "photo") {
          activeJob = null; busy = false;
          choices.replaceChildren(); actions.hidden = true;
        }
        return;
      }
      await new Promise(r => setTimeout(r, 1000));
    }
  }

  async function loadList() {
    if (loading) return;
    loading = true;
    try {
      const { scans, max, canManage } = await request("/api/scans");
      listError.textContent = "";
      document.getElementById("count").textContent = `${scans.length} / ${max}`;
      list.replaceChildren();
      if (!scans.length) {
        const empty = document.createElement("li");
        empty.textContent = "아직 없어요.";
        list.appendChild(empty);
      }
      for (const s of scans) {
        const li = document.createElement("li"), preview = document.createElement(s.thumb ? "img" : "span");
        preview.className = "thumb";
        if (s.thumb) { preview.src = "/" + s.thumb; preview.alt = s.name; preview.loading = "lazy"; }
        const details = document.createElement("span"), name = document.createElement("b");
        details.className = "details";
        name.textContent = s.name;   // 표시 이름은 사용자가 정하므로 HTML로 넣지 않음
        details.append(name, document.createElement("br"), `삼각형 ${Number(s.triangles || 0).toLocaleString()}개`);
        li.append(preview, details);
        if (canManage) {
          const remove = document.createElement("button");
          remove.className = "delete";
          remove.textContent = "지우기";
          remove.onclick = async () => {
            if (!confirm(`'${s.name}' 스캔을 지울까요?`)) return;
            remove.disabled = true;
            try { await request(`/api/scans/${encodeURIComponent(s.itemId)}`, { method: "DELETE" }); await loadList(); }
            catch (e) { show(e.message, "bad"); remove.disabled = false; }
          };
          li.appendChild(remove);
        }
        list.appendChild(li);
      }
    } catch (e) {
      listError.textContent = "목록을 불러오지 못했어요: " + e.message;
    } finally {
      loading = false;
    }
  }
  loadList();
  setInterval(loadList, 5000);
  async function loadWorker() {
    let text = "연결 안 됨";
    try {
      const state = await request("/api/scans/worker");
      if (state.ok) text = state.loaded ? "연결됨" : "모델 준비 중";
    } catch (_) {}
    document.getElementById("worker").textContent = "3D 생성 PC: " + text;
  }
  loadWorker();
  setInterval(loadWorker, 10000);
</script>
</body>
</html>
